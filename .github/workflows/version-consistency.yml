name: Version consistency

# Contrôle rapide et sans dépendances : versions du manifeste, tête des notes
# de version et dernier tag <app>-vX.Y.Z de chaque application.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-versions:
    name: Versions et tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique et tags complets)
        uses: actions/checkout@v7
        with:
          # Les tags sont lus par tests/test_release_versions.py : un clone
          # superficiel les omettrait et le contrôle se contenterait d'être ignoré.
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Tests de cohérence version / notes / tags
        run: python3 -m unittest discover -s tests -v

      - name: Changelogs README synchronises avec les notes
        run: |
          for app in Fabtrack FabBoard PretGo FabHome FabInventory/FabInventory; do
            python3 changelog_gen.py --app "./$app" --check
          done

      - name: Aucune note de version en attente
        run: |
          for app in Fabtrack FabBoard PretGo FabHome FabInventory/FabInventory; do
            python3 release_notes_gen.py --app "./$app" --check
          done

      - name: Contrat FabSuite (copies de fabsuite_core et manifestes)
        run: python3 -m unittest discover -s tests -p 'contract_*.py' -v

  tests-apps:
    name: Tests ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Les suites des applications exigent Flask : elles tournent par application
    # dans leur propre environnement plutôt que dans le job de cohérence.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Fabtrack
            label: Fabtrack
          - app: FabBoard
            label: FabBoard
          - app: PretGo
            label: PretGo
          - app: FabHome
            label: FabHome
          - app: FabInventory/FabInventory
            label: FabInventory
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Dépendances de l'application
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tests unittest
        run: |
          # FabInventory fige sa base a l'import de app.py : son runner lance
          # chaque module dans un processus a part.
          if [ -f tests/run_all.py ]; then
            python3 tests/run_all.py
          else
            python3 -m unittest discover -s tests -v
          fi

  smoke-apps:
    name: Demarrage des cinq applications
    runs-on: ubuntu-latest
    # Apres les suites unitaires : ce job verifie que chaque application demarre
    # reellement et repond, pas seulement que ses tests passent.
    needs: [tests-apps]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Dependances des applications
        run: |
          python3 -m pip install --disable-pip-version-check \
            -r Fabtrack/requirements.txt \
            -r FabBoard/requirements.txt \
            -r PretGo/requirements.txt \
            -r FabHome/requirements.txt \
            -r FabInventory/FabInventory/requirements.txt

      - name: Smoke test des cinq applications
        run: python3 smoke_test_apps.py --verbose
