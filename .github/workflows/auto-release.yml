name: Auto release

# Un push sur main cree les tags <app>-vX.Y.Z et les releases GitHub manquants,
# sans secret supplementaire : le GITHUB_TOKEN du workflow a contents: write.
# Une application dont les notes sont en attente (release_notes_gen --check en
# echec) est ignoree : aucune release n'est publiee sans notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tags et releases manquants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique et tags complets)
        uses: actions/checkout@v7
        with:
          # Les tags existants sont relus par release_publish.py : un clone
          # superficiel les omettrait et republierait tout.
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Identite git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tags et releases manquants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publiees=0
          for app in Fabtrack FabBoard PretGo FabHome FabInventory/FabInventory; do
            nom=$(basename "$app")

            slug=$(python3 -c "import release_publish as rp; from pathlib import Path; print(rp.app_slug(Path('$app')))")
            tag=$(python3 -c "import release_publish as rp; from pathlib import Path; a = Path('$app'); print(rp.tag_for(rp.app_slug(a), rp.read_app_version(a)))")

            # Aligne les liens `url` sur les tags reellement presents (un premier
            # passage peut avoir des liens vers des tags jamais pousses) : la
            # validation ci-dessous refuse un lien sans tag, et doit donc passer
            # apres cette synchro, sans quoi l'application serait ignoree.
            python3 release_notes_gen.py --app "./$app" --sync-release-links >/dev/null

            # Sans notes a jour, on ne publie rien pour cette application.
            # Exception : application jamais taguee ici (publication initiale).
            # Le garde-fou compte alors tous les commits depuis 50 revisions
            # comme des notes en attente, ce qui interdirait a jamais le premier
            # tag ; release_publish.py revalide de son cote version, tete des
            # notes et liens avant de poser le tag.
            if git tag --list "$slug-v*" | grep -q .; then
              if ! python3 release_notes_gen.py --app "./$app" --check; then
                echo "::notice::$nom : notes en attente, release ignoree"
                continue
              fi
            else
              echo "$nom : aucun tag $slug-v* sur ce depot, publication initiale"
            fi

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "$nom : $tag deja publie"
                continue
              fi
              echo "$nom : tag $tag present, release manquante"
            else
              python3 release_publish.py --app "./$app"
              git push origin "refs/tags/$tag"
            fi

            python3 release_publish.py --tag "$tag" --output "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-title.txt"
            gh release create "$tag" \
              --title "$(cat "$RUNNER_TEMP/release-title.txt")" \
              --notes-file "$RUNNER_TEMP/release-body.md"
            echo "$nom : release $tag publiee"
            publiees=$((publiees + 1))
          done
          echo "$publiees release(s) publiee(s)"

      - name: Committer les liens de release
        run: |
          set -euo pipefail
          # release_publish.py ecrit le lien de chaque version qu'il vient de
          # taguer : le commit ne depend pas de la visibilite des tags par git.
          if git diff --quiet; then
            echo "Aucun lien de release a publier."
            exit 0
          fi

          git add -A -- '*/static/release-notes.json'
          # Sujet en "Docs:" : le generateur de notes ignore ces commits, donc
          # ce retour d'ecriture ne laisse pas de note en attente.
          git commit -m "Docs: lier les notes de version aux releases publiees"
          # Explicitement vers main : le checkout d'Actions peut ne pas avoir de
          # branche locale de meme nom que sa branche de suivi.
          git push origin HEAD:main
