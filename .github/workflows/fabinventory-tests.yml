name: Tests FabInventory

# Suites de FabInventory sur chaque pull request, avant fusion.
#
# `Version consistency` ne lance les suites applicatives qu'apres `Auto
# release`, donc apres fusion sur `main` : une regression pouvait atteindre la
# branche principale sans controle. Ce workflow rejoue les suites locales des
# qu'une PR touche l'application, ainsi qu'un parc synthetique de 500 PC pour
# verifier que les pages critiques gardent leur budget SQL et leur temps de
# reponse.
#
# Aucun secret n'est necessaire : les tests creent leur base temporaire.
on:
  push:
    branches: [main]
    paths:
      - "FabInventory/FabInventory/**"
      - ".github/workflows/fabinventory-tests.yml"
  pull_request:
    paths:
      - "FabInventory/FabInventory/**"
      - ".github/workflows/fabinventory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deux pushes rapproches enchainent deux executions : seule la derniere compte.
concurrency:
  group: fabinventory-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unittest FabInventory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FabInventory/FabInventory
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Dependances de l'application
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compilation des modules
        run: python3 -m py_compile app.py tools/*.py tests/*.py

      - name: Compilation des templates
        # Un template casse cassait la page concernee sans faire echouer les
        # tests : la compilation est peu couteuse et couvre les 31 templates.
        run: |
          python3 - <<'PY'
          from jinja2 import Environment, FileSystemLoader

          env = Environment(loader=FileSystemLoader("templates"))
          noms = env.list_templates()
          assert noms, "aucun template trouve"
          for nom in noms:
              source = env.loader.get_source(env, nom)[0]
              env.parse(source, filename=nom)
          print(f"{len(noms)} templates compiles")
          PY

      - name: Suites (un processus par module)
        # app.py fige son chemin de base a l'import : run_all.py lance chaque
        # module dans son propre processus.
        run: python3 tests/run_all.py

  parc-500-pc:
    name: Parc 500 PC et budgets
    runs-on: ubuntu-latest
    needs: [tests]
    defaults:
      run:
        working-directory: FabInventory/FabInventory
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Dependances de l'application
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generation du parc et mesure des pages critiques
        # 500 masters, 10 000 snapshots, 400 000 lignes d'index logiciel. Le
        # jeu est genere ici, jamais commite. Le job echoue si une page depasse
        # son budget SQL ou le seuil de temps de reponse.
        run: |
          python3 tools/parc_scale.py \
            --db "$RUNNER_TEMP/parc-500.db" \
            --masters 500 \
            --snapshots-per-master 20 \
            --force \
            --benchmark
