name: Tests racine

# Suites de la racine du monorepo (module de sauvegarde, GUI SSH, contrats,
# notes de version) sur chaque push et pull request.
#
# `Version consistency` ne lance ces tests qu'apres `Auto release` : une
# regression pouvait donc atteindre `main` sans controle, et une PR n'etait
# couverte par aucune CI. Ce workflow ne fait que relancer les suites locales,
# sans dependance supplementaire (les application ont leurs propres jobs).
#
# `tests/test_release_versions.py` est volontairement exclu ici : il compare la
# version publiee au dernier tag `<app>-vX.Y.Z`, or `Auto release` cree ce tag
# quelques secondes apres le push. Execute sur le push, il passait au rouge a
# chaque changement de version. Il reste execute par `Version consistency`, qui
# est declenche a la fin de `Auto release`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deux pushes rapproches enchainent deux executions : seule la derniere compte.
concurrency:
  group: tests-racine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-racine:
    name: unittest (racine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique et tags complets)
        uses: actions/checkout@v7
        with:
          # test_release_versions.py compare les manifestes au dernier tag
          # <app>-vX.Y.Z : un clone superficiel omet les tags.
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compilation des modules racine
        run: |
          python3 -m py_compile \
            suite_backup.py \
            fabsuite_ssh_gui.py \
            changelog_gen.py \
            release_notes_gen.py \
            release_publish.py

      - name: Tests racine (hors controle des tags de release)
        # Controle des tags : voir l'entete du workflow et `Version
        # consistency`, seul endroit ou les tags de la release existent deja.
        run: |
          set -euo pipefail
          modules=$(cd tests && ls test_*.py | grep -vx 'test_release_versions.py' | sed 's/\.py$//' | sort)
          PYTHONPATH="$PWD/tests" python3 -m unittest $modules -v
