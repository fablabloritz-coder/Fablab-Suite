<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Admin — FabInventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow" style="width:360px;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-hdd-stack-fill" style="font-size:2.5rem;color:#2563eb;"></i>
      <h4 class="mt-2 mb-0 fw-bold">FabInventory</h4>
      <p class="text-muted small">Espace administration</p>
    </div>
    {% if error %}
    <div class="alert alert-danger small">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Identifiant</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mot de passe</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Connexion
      </button>
    </form>
    <hr class="mt-4">
    <p class="text-center small text-muted">
      <a href="/" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Retour à l'inventaire</a>
    </p>
  </div>
</div>
</body>
</html>
