{% extends "admin/base_admin.html" %}
{% block title %}Paramètres — Admin FabInventory{% endblock %}

{% block content %}
<h3 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-primary"></i>Paramètres</h3>

<div class="row">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-semibold">Changer le mot de passe</div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger small">{{ error }}</div>
        {% endif %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Mot de passe actuel</label>
            <input type="password" name="old_password" class="form-control" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmer</label>
            <input type="password" name="confirm_password" class="form-control" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary">Mettre à jour</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
