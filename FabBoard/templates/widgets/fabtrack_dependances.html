<div class="widget widget-fabtrack-dependances" id="widget-fabtrack-dependances-{{ widget_id }}" data-widget-code="fabtrack_dependances">
    <h3>
        <i class="bi bi-diagram-3"></i> Dépendances externes
        <span class="dep-count js-dep-count"></span>
    </h3>
    <div class="js-dependances-liste">
        <div class="dep-vide">Chargement…</div>
    </div>
</div>

<style>
.widget-fabtrack-dependances {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0.4rem;
}
.widget-fabtrack-dependances h3 {
    flex-shrink: 0;
    margin-bottom: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.4em;
}
.widget-fabtrack-dependances .dep-count {
    font-size: 0.7em;
    font-weight: 700;
    background: rgba(56, 189, 248, 0.18);
    color: #7dd3fc;
    border-radius: 9999px;
    padding: 0 0.5em;
}
.widget-fabtrack-dependances .js-dependances-liste {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    /* Une TV ne se fait pas defiler : la vue avance seule (voir le script).
       La barre de defilement n'aurait donc plus de sens. */
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
}
.widget-fabtrack-dependances .js-dependances-liste::-webkit-scrollbar {
    display: none;
}
.widget-fabtrack-dependances .dep-groupe {
    background: rgba(148, 163, 184, 0.06);
    border-radius: 8px;
    padding: 0.35em 0.45em 0.4em;
    border-left: 4px solid #38bdf8;
}
.widget-fabtrack-dependances .dep-groupe-titre {
    display: flex;
    align-items: center;
    gap: 0.4em;
    font-size: clamp(11px, calc(0.7 * var(--lw, 1vw) * var(--ws, 1)), 26px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #cbd5e1;
    margin-bottom: 0.25em;
}
.widget-fabtrack-dependances .dep-groupe-dot {
    width: 0.6em;
    height: 0.6em;
    border-radius: 50%;
    flex: 0 0 0.6em;
    background: #94a3b8;
}
.widget-fabtrack-dependances .dep-groupe-count {
    margin-left: auto;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    padding: 0 0.45em;
    font-size: 0.85em;
}
.widget-fabtrack-dependances .dep-mission {
    padding: 0.2em 0.1em;
    border-top: 1px solid rgba(148, 163, 184, 0.12);
}
.widget-fabtrack-dependances .dep-mission:first-child {
    border-top: none;
}
.widget-fabtrack-dependances .dep-titre {
    font-size: clamp(14px, calc(0.95 * var(--lw, 1vw) * var(--ws, 1)), 40px);
    font-weight: 600;
    color: #e2e8f0;
    line-height: 1.25;
}
.widget-fabtrack-dependances .dep-etape {
    font-size: clamp(12px, calc(0.78 * var(--lw, 1vw) * var(--ws, 1)), 32px);
    color: #94a3b8;
    margin-top: 0.1em;
    line-height: 1.25;
}
.widget-fabtrack-dependances .dep-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35em;
    margin-top: 0.12em;
}
.widget-fabtrack-dependances .dep-badge {
    font-size: clamp(11px, calc(0.68 * var(--lw, 1vw) * var(--ws, 1)), 28px);
    font-weight: 600;
    padding: 0.08em 0.45em;
    border-radius: 4px;
    white-space: nowrap;
}
.widget-fabtrack-dependances .dep-badge.statut-a_faire { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
.widget-fabtrack-dependances .dep-badge.statut-en_cours { background: rgba(249, 115, 22, 0.18); color: #fdba74; }
.widget-fabtrack-dependances .dep-badge.statut-termine { background: rgba(74, 222, 128, 0.16); color: #86efac; }
.widget-fabtrack-dependances .dep-badge.ech-late  { background: rgba(239, 68, 68, 0.2); color: #f87171; }
.widget-fabtrack-dependances .dep-badge.ech-today { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
.widget-fabtrack-dependances .dep-badge.ech-soon  { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
.widget-fabtrack-dependances .dep-badge.ech-ok    { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }
.widget-fabtrack-dependances .dep-vide {
    color: #4ade80;
    text-align: center;
    padding: 1.5rem 0.5rem;
    font-size: clamp(14px, calc(0.95 * var(--lw, 1vw) * var(--ws, 1)), 40px);
}
.widget-fabtrack-dependances .dep-plus {
    color: #64748b;
    font-size: clamp(11px, calc(0.72 * var(--lw, 1vw) * var(--ws, 1)), 26px);
    text-align: center;
    padding-top: 0.1rem;
}
</style>

<script>
(function () {
    const root = document.getElementById('widget-fabtrack-dependances-{{ widget_id }}');
    if (!root) return;

    const liste = root.querySelector('.js-dependances-liste');
    const compteur = root.querySelector('.js-dep-count');
    const config = {{ config | tojson | safe }};

    const maxItems = Math.max(1, parseInt(config.nombre_max, 10) || 12);
    // La case a cocher enregistre un booleen, mais une config ancienne ou
    // editee a la main peut porter 1 ou "1" : sans ca, l'option semblait
    // inactive et les missions terminees restaient masquees.
    const inclureTerminees = config.inclure_terminees === true
        || config.inclure_terminees === 1
        || config.inclure_terminees === '1';
    const afficherEtape = config.afficher_etape !== false;
    const sourceId = config.source_id || null;

    // Normalisation commune (services, statuts, regroupements) : sans accents
    // ni casse. « periscolaire » trouve « Périscolaire », « terminée » se
    // compare a « terminee ».
    function normaliser(valeur) {
        return String(valeur == null ? '' : valeur)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toLowerCase();
    }

    // Le filtre accepte une saisie partielle (« Imprimerie » pour « Imprimerie
    // municipale ») et plusieurs saisies separees par des virgules.
    const servicesFiltre = String(config.services || '')
        .split(',')
        .map(normaliser)
        .filter(Boolean);

    function serviceRetenu(nom) {
        if (!servicesFiltre.length) return true;
        const cible = normaliser(nom);
        return servicesFiltre.some(function (filtre) {
            return cible.includes(filtre);
        });
    }

    function esc(valeur) {
        const d = document.createElement('div');
        d.textContent = valeur == null ? '' : String(valeur);
        return d.innerHTML;
    }

    function isHexColor(valeur) {
        return /^#[0-9a-fA-F]{6}$/.test(valeur || '');
    }

    // Marqueur derive de `missions.service_id` cote Fabtrack. Un payload plus
    // ancien, ou un service supprime, peut n'avoir que le nom du service : on
    // retombe alors sur service_id puis sur service_nom.
    function dependDeService(mission) {
        if (!mission) return false;
        if (Number(mission.depend_service_externe) === 1) return true;
        const serviceId = Number(mission.service_id);
        if (Number.isFinite(serviceId) && serviceId > 0) return true;
        return String(mission.service_nom || '').trim() !== '';
    }

    // Une echeance Fabtrack est une date civile (`YYYY-MM-DD`), pas un instant :
    // `new Date('2026-11-15')` la lit a minuit UTC, soit le 14 novembre a 19 h
    // a New York, et le badge affichait la veille a l'ouest de Greenwich. On
    // construit donc la date dans le fuseau local du navigateur.
    function dateLocale(valeur) {
        const texte = String(valeur == null ? '' : valeur).trim().slice(0, 10);
        const morceaux = /^(\d{4})-(\d{2})-(\d{2})$/.exec(texte);
        // Format inattendu (ISO complet, etc.) : on garde le comportement d'origine.
        if (!morceaux) return new Date(texte);
        const annee = Number(morceaux[1]);
        const mois = Number(morceaux[2]) - 1;
        const jour = Number(morceaux[3]);
        const date = new Date(annee, mois, jour);
        // `new Date(2026, 12, 40)` normalise au lieu d'echouer : on rejette les
        // composantes qui ne correspondent pas a la date saisie.
        const valide = date.getFullYear() === annee
            && date.getMonth() === mois
            && date.getDate() === jour;
        return valide ? date : new Date(NaN);
    }

    function echeanceHtml(mission, terminee) {
        if (!mission.date_echeance) return '';
        const date = dateLocale(mission.date_echeance);
        if (isNaN(date.getTime())) return '';
        // Mission terminee : l'echeance n'est plus surveillee. On garde la date
        // pour situer la mission, en style neutre, sans "En retard" ni
        // "Aujourd'hui" qui n'ont plus de sens.
        if (terminee) {
            const jour = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
            return '<span class="dep-badge ech-ok">' + esc('\u{1F4C5} ' + jour) + '</span>';
        }
        const aujourdhui = new Date();
        aujourdhui.setHours(0, 0, 0, 0);
        const jours = Math.round((date - aujourdhui) / 86400000);
        let classe = 'ech-ok';
        let libelle = '';
        if (jours < 0) {
            classe = 'ech-late';
            libelle = 'En retard (' + Math.abs(jours) + 'j)';
        } else if (jours === 0) {
            classe = 'ech-today';
            libelle = "Aujourd'hui";
        } else if (jours <= 3) {
            classe = 'ech-soon';
            libelle = 'Dans ' + jours + 'j';
        } else {
            libelle = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
        }
        return '<span class="dep-badge ' + classe + '">' + esc('\u{1F4C5} ' + libelle) + '</span>';
    }

    // Fabtrack envoie 'termine', mais le champ peut arriver capitalise ou
    // accentue ('Termine', 'terminé') et les payloads anterieurs au marqueur
    // n'ont pas toujours `statut` : `completed_at` sert alors de repli.
    function estTerminee(mission) {
        const statut = normaliser(mission.statut);
        if (statut === 'termine' || statut === 'terminee' || statut === 'done' || statut === 'completed') {
            return true;
        }
        return statut === '' && Boolean(mission.completed_at);
    }

    function statutDeMission(mission) {
        if (estTerminee(mission)) return { texte: 'Terminé', classe: 'statut-termine' };
        if (normaliser(mission.statut) === 'en_cours') return { texte: 'En cours', classe: 'statut-en_cours' };
        return { texte: 'À faire', classe: 'statut-a_faire' };
    }

    function missionHtml(mission) {
        const terminee = estTerminee(mission);
        const statut = statutDeMission(mission);
        const etape = afficherEtape && mission.derniere_etape_texte
            ? '<div class="dep-etape">Étape : ' + esc(mission.derniere_etape_texte) + '</div>'
            : '';
        const echeance = echeanceHtml(mission, terminee);
        return '<div class="dep-mission">'
            + '<div class="dep-titre">' + esc(mission.titre || 'Mission') + '</div>'
            + etape
            + '<div class="dep-meta">'
            + '<span class="dep-badge ' + statut.classe + '">' + esc(statut.texte) + '</span>'
            + echeance
            + '</div></div>';
    }

    function groupeHtml(groupe, missions) {
        const couleur = isHexColor(groupe.couleur) ? groupe.couleur : '#94a3b8';
        return '<div class="dep-groupe" style="border-left-color:' + couleur + '">'
            + '<div class="dep-groupe-titre">'
            + '<span class="dep-groupe-dot" style="background:' + couleur + '"></span>'
            + esc(groupe.nom)
            + '<span class="dep-groupe-count">' + groupe.total + '</span>'
            + '</div>'
            + missions.map(missionHtml).join('')
            + '</div>';
    }

    // Le DOM n'est reecrit que si le rendu change : le store peut rafraichir
    // les donnees toutes les 30 s sans que rien n'ait bouge. Reecrire la liste
    // a l'identique relancerait le defilement en page 1 et les pages suivantes
    // ne resteraient jamais affichees assez longtemps.
    let dernierHtml = null;

    function appliquerListe(html) {
        if (html === dernierHtml) return false;
        dernierHtml = html;
        liste.innerHTML = html;
        return true;
    }

    function render(missions) {
        const retenues = (missions || []).filter(function (mission) {
            if (!dependDeService(mission)) return false;
            if (!inclureTerminees && estTerminee(mission)) return false;
            if (!serviceRetenu(mission.service_nom)) return false;
            return true;
        });

        if (compteur) compteur.textContent = retenues.length ? String(retenues.length) : '';

        if (!retenues.length) {
            const message = servicesFiltre.length
                ? 'Aucune mission en attente des services sélectionnés'
                : 'Aucune mission en attente d\u2019un service externe';
            return appliquerListe('<div class="dep-vide"><i class="bi bi-check2-circle"></i> ' + esc(message) + '</div>');
        }

        // Regroupement par service, dans l'ordre de la liste Fabtrack.
        const groupes = new Map();
        retenues.forEach(function (mission) {
            const nom = String(mission.service_nom || '').trim() || 'Service externe';
            const cle = normaliser(nom);
            if (!groupes.has(cle)) {
                groupes.set(cle, { nom: nom, couleur: mission.service_couleur, total: 0, missions: [] });
            }
            const groupe = groupes.get(cle);
            groupe.total += 1;
            groupe.missions.push(mission);
        });

        let restant = maxItems;
        let affichees = 0;
        const blocs = [];
        groupes.forEach(function (groupe) {
            if (restant <= 0) return;
            const visibles = groupe.missions.slice(0, restant);
            restant -= visibles.length;
            affichees += visibles.length;
            blocs.push(groupeHtml(groupe, visibles));
        });

        const reste = retenues.length - affichees;
        return appliquerListe(blocs.join('')
            + (reste > 0
                ? '<div class="dep-plus">… et ' + reste + ' autre' + (reste > 1 ? 's' : '') + ' mission' + (reste > 1 ? 's' : '') + '</div>'
                : ''));
    }

    // Une TV ne se fait pas defiler a la main : quand la liste depasse la
    // cellule, la vue avance seule d'une page a la fois, chaque page demarrant
    // sur une mission entiere, puis revient en haut. Sans ca, les groupes
    // au-dela du visible restaient inaccessibles.
    const INTERVALLE_DEFILEMENT_MS = 10000;

    // Positions de defilement (px) qui montrent tout le contenu : 0 puis, tant
    // que la fin n'est pas atteinte, le dernier element dont le haut tient dans
    // la page. `bornes` = hauts des elements (groupes, missions, ligne « et N
    // autres ») en px depuis le debut du contenu.
    function pagesDeDefilement(hauteurContenu, hauteurVisible, bornes) {
        const maximum = Math.max(0, Math.round((hauteurContenu || 0) - (hauteurVisible || 0)));
        if (!(hauteurVisible > 0) || maximum < 2) return [0];
        const departs = (bornes || [])
            .map(Number)
            .filter(function (valeur) {
                return Number.isFinite(valeur) && valeur > 0 && valeur <= maximum;
            })
            .sort(function (a, b) { return a - b; });
        // Une page doit avancer d'au moins 20 % de la hauteur visible : sinon un
        // element colle au debut creerait une page presque identique a la
        // precedente. En dessous, on avance d'une page pleine.
        const progression = Math.max(24, Math.round(hauteurVisible * 0.2));
        const pages = [0];
        let courant = 0;
        while (courant < maximum - 1 && pages.length < 100) {
            const limite = courant + hauteurVisible;
            let suivant = 0;
            departs.forEach(function (valeur) {
                if (valeur > courant + 1 && valeur <= limite) suivant = valeur;
            });
            courant = suivant > courant + progression
                ? suivant
                : Math.min(maximum, Math.round(limite));
            pages.push(courant);
        }
        return pages;
    }

    function bornesDePages() {
        const base = liste.getBoundingClientRect ? liste.getBoundingClientRect().top : 0;
        const defilement = liste.scrollTop || 0;
        const elements = liste.querySelectorAll('.dep-groupe, .dep-mission, .dep-plus');
        const bornes = [];
        Array.prototype.forEach.call(elements, function (element) {
            if (!element.getBoundingClientRect) return;
            bornes.push(Math.round(element.getBoundingClientRect().top - base + defilement));
        });
        return bornes;
    }

    let minuteurDefilement = null;
    let indexDefilement = 0;

    function arreterDefilement() {
        if (minuteurDefilement !== null) {
            clearInterval(minuteurDefilement);
            minuteurDefilement = null;
        }
        indexDefilement = 0;
    }

    function pagesCourantes() {
        return pagesDeDefilement(liste.scrollHeight || 0, liste.clientHeight || 0, bornesDePages());
    }

    function demarrerDefilement() {
        arreterDefilement();
        liste.scrollTop = 0;
        if (pagesCourantes().length < 2) return;
        minuteurDefilement = setInterval(function () {
            if (!root.isConnected || !liste.isConnected) {
                arreterDefilement();
                return;
            }
            const pages = pagesCourantes();
            if (pages.length < 2) {
                arreterDefilement();
                liste.scrollTop = 0;
                return;
            }
            indexDefilement = (indexDefilement + 1) % pages.length;
            if (liste.scrollTo) {
                liste.scrollTo({ top: pages[indexDefilement], behavior: 'smooth' });
            } else {
                liste.scrollTop = pages[indexDefilement];
            }
        }, INTERVALLE_DEFILEMENT_MS);
    }

    // Expose pour les tests Node (FabBoard/tests/js/dependances_widget_check.js) :
    // le calcul des pages est pur, la geometrie reelle est verifiee en slide.
    window.FabBoardDependances = { pagesDeDefilement: pagesDeDefilement };

    function refresh() {
        const store = window.FabBoardStore;
        // Une source configuree est la seule utilisee : tant qu'elle n'a pas
        // repondu, mieux vaut l'etat vide que les missions d'une autre source.
        const donnees = sourceId
            ? (store && store.getSource(sourceId))
            : (store && store.data);
        const contenuChange = render(donnees && Array.isArray(donnees.missions) ? donnees.missions : []);
        // Un rafraichissement sans changement ne doit ni reecrire la liste, ni
        // relancer le minuteur, ni revenir en page 1 : la page courante est
        // conservee. On (re)demarre au premier rendu, apres un changement de
        // contenu, ou si le minuteur s'etait arrete.
        if (contenuChange || minuteurDefilement === null) {
            demarrerDefilement();
        }
    }

    function onDashboardRefresh() {
        if (!root.isConnected) {
            document.removeEventListener('fabboard:refresh', onDashboardRefresh);
            return;
        }
        refresh();
    }

    document.addEventListener('fabboard:refresh', onDashboardRefresh);
    refresh();
})();
</script>
