<div class="widget widget-fabtrack-depassements" id="widget-fabtrack-depassements-{{ widget_id }}" data-widget-code="fabtrack_depassements">
    <h3><i class="bi bi-exclamation-triangle"></i> Dépassements de seuil</h3>
    <div class="js-depassements-liste">
        <div style="color: #94a3b8;">Chargement...</div>
    </div>
</div>

<style>
.widget-fabtrack-depassements {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0.4rem;
}
.widget-fabtrack-depassements h3 {
    flex-shrink: 0;
    margin-bottom: 0.4rem;
}
.widget-fabtrack-depassements .js-depassements-liste {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
}
.widget-fabtrack-depassements .dep-item {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.45em 0.6em;
    border-radius: 8px;
    background: rgba(239, 68, 68, 0.10);
    border-left: 4px solid #ef4444;
    font-size: calc(0.85rem * var(--ws, 1));
}
.widget-fabtrack-depassements .dep-valeur {
    font-weight: 700;
    color: #fca5a5;
    white-space: nowrap;
}
.widget-fabtrack-depassements .dep-type {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.widget-fabtrack-depassements .dep-meta {
    color: #94a3b8;
    font-size: 0.85em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.widget-fabtrack-depassements .dep-vide {
    color: #4ade80;
    text-align: center;
    padding: 1.5rem 0.5rem;
    font-size: calc(0.95rem * var(--ws, 1));
}
</style>

<script>
(function () {
    const root = document.getElementById('widget-fabtrack-depassements-{{ widget_id }}');
    if (!root) return;

    const liste = root.querySelector('.js-depassements-liste');
    const config = {{ config | tojson | safe }};
    const maxItems = config.max_items || 8;
    const sourceId = config.source_id || null;

    function esc(v) {
        const d = document.createElement('div');
        d.textContent = v == null ? '' : String(v);
        return d.innerHTML;
    }

    function nombre(valeur, decimales) {
        return Number(valeur || 0).toLocaleString('fr-FR', {
            maximumFractionDigits: decimales,
        });
    }

    function render(rows) {
        if (!rows || !rows.length) {
            liste.innerHTML = '<div class="dep-vide"><i class="bi bi-check2-circle"></i> Aucun dépassement sur 7 jours</div>';
            return;
        }

        liste.innerHTML = rows.slice(0, maxItems).map(function (r) {
            const date = String(r.date_saisie || '').slice(0, 10);
            const jour = date ? date.split('-').reverse().join('/') : '';
            const projet = r.projet ? ' · ' + esc(r.projet) : '';
            const ratio = r.ratio ? ' · ×' + nombre(r.ratio, 1) : '';
            return '<div class="dep-item" title="Seuil : ' + esc(nombre(r.seuil, 2) + ' ' + (r.unite || '')) + '">'
                + '<span class="dep-valeur">' + esc(nombre(r.valeur, 2) + ' ' + (r.unite || '')) + '</span>'
                + '<span class="dep-type">' + esc(r.type || 'Saisie')
                + '<span class="dep-meta">' + esc(jour + projet + ratio) + '</span></span>'
                + '</div>';
        }).join('');
    }

    function refresh() {
        const store = window.FabBoardStore;
        let rows = [];

        if (sourceId && store && store.getSource(sourceId)) {
            rows = store.getSource(sourceId).depassements || [];
        } else if (store && store.data) {
            rows = store.data.depassements || [];
        }

        render(rows);
    }

    function onDashboardRefresh() {
        if (!root.isConnected) {
            document.removeEventListener('fabboard:refresh', onDashboardRefresh);
            return;
        }
        refresh();
    }

    document.addEventListener('fabboard:refresh', onDashboardRefresh);
    refresh();
})();
</script>
